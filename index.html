document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-800: #5c4a08;\n  --yellow-900: #3a2f06;\n\n  /* ---------------------------------------------------------\n     BLUE SCALE (spritzig / fresh)\n     --------------------------------------------------------- */\n  --blue-50:  #f0fafe;\n  --blue-100: #d9f2fc;\n  --blue-200: #94d5f4;   /* brand */\n  --blue-300: #5cbeed;\n  --blue-400: #2ba3dd;\n  --blue-500: #1486c0;\n  --blue-600: #0f6a9b;\n  --blue-700: #0d5379;\n  --blue-800: #0c3f5b;\n  --blue-900: #08293b;\n\n  /* ---------------------------------------------------------\n     SAGE / GREEN SCALE (grounding)\n     --------------------------------------------------------- */\n  --sage-50:  #f8f8f2;\n  --sage-100: #eeeede;\n  --sage-200: #dddcc3;\n  --sage-300: #bebc9b;   /* brand */\n  --sage-400: #a3a078;\n  --sage-500: #87845f;\n  --sage-600: #6b694b;\n  --sage-700: #514f39;\n  --sage-800: #373627;\n  --sage-900: #232217;\n\n  /* ---------------------------------------------------------\n     WARM NEUTRALS — cream paper to deep cocoa ink\n     --------------------------------------------------------- */\n  --neutral-0:   #ffffff;\n  --paper:       #ffffff;  /* default page background — WHITE (brand rule: backgrounds are always black or white) */\n  --neutral-50:  #faf6ee;\n  --neutral-100: #f3ece0;\n  --neutral-200: #e7ddcb;\n  --neutral-300: #d4c7b1;\n  --neutral-400: #b3a48b;\n  --neutral-500: #8a7c68;\n  --neutral-600: #645847;\n  --neutral-700: #463d2f;\n  --neutral-800: #2e261a;\n  --neutral-900: #1c1610;  /* deepest warm ink */\n\n  /* ---------------------------------------------------------\n     SEMANTIC / FUNCTIONAL — harmonized with the warm palette\n     --------------------------------------------------------- */\n  --success:     #2f9e5b;\n  --success-bg:  #e4f5ea;\n  --success-fg:  #1c6b3c;\n  --warning:     #f0a91b;  /* deepened yellow for AA on white */\n  --warning-bg:  #fdf1d3;\n  --warning-fg:  #8a6f08;\n  --danger:      #d83a2c;\n  --danger-bg:   #fbe5e2;\n  --danger-fg:   #9c2018;\n  --info:        #1486c0;\n  --info-bg:     #d9f2fc;\n  --info-fg:     #0d5379;\n\n  /* ---------------------------------------------------------\n     SEMANTIC ROLES — use these in product UI\n     --------------------------------------------------------- */\n  --bg:          var(--paper);\n  --bg-subtle:   var(--neutral-50);\n  --surface:     var(--neutral-0);\n  --surface-2:   var(--neutral-50);\n  --border:      var(--neutral-200);\n  --border-strong: var(--neutral-300);\n\n  --fg:          var(--neutral-900);   /* primary text */\n  --fg-2:        var(--neutral-600);   /* secondary text */\n  --fg-3:        var(--neutral-500);   /* muted / captions */\n  --fg-on-brand: #ffffff;              /* text on orange */\n\n  --primary:        var(--orange-500);\n  --primary-hover:  var(--orange-600);\n  --primary-press:  var(--orange-700);\n  --primary-soft:   var(--orange-50);\n  --accent:         var(--blue-400);\n  --highlight:      var(--yellow-400);\n  --ring:           color-mix(in srgb, var(--orange-500) 45%, transparent);\n\n  /* ---------------------------------------------------------\n     TYPOGRAPHY — families\n     --------------------------------------------------------- */\n  --font-display: 'Fredoka', 'Outfit', system-ui, sans-serif;\n  --font-display-alt: 'Outfit', system-ui, sans-serif;\n  --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, monospace;\n\n  /* Type scale (1.250 major-third-ish, tuned) */\n  --text-xs:   0.75rem;   /* 12 */\n  --text-sm:   0.875rem;  /* 14 */\n  --text-base: 1rem;      /* 16 */\n  --text-md:   1.125rem;  /* 18 */\n  --text-lg:   1.375rem;  /* 22 */\n  --text-xl:   1.75rem;   /* 28 */\n  --text-2xl:  2.25rem;   /* 36 */\n  --text-3xl:  3rem;      /* 48 */\n  --text-4xl:  3.875rem;  /* 62 */\n  --text-5xl:  5rem;      /* 80 */\n\n  --leading-tight: 1.08;\n  --leading-snug:  1.2;\n  --leading-normal:1.5;\n  --leading-relaxed:1.65;\n\n  --tracking-tight: -0.01em;\n  --tracking-snug:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:  0.04em;\n  --tracking-caps:  0.08em;\n\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n  --weight-extra:   800;\n\n  /* ---------------------------------------------------------\n     SPACING (4px base)\n     --------------------------------------------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---------------------------------------------------------\n     RADII — friendly, generously rounded\n     --------------------------------------------------------- */\n  --radius-xs:  6px;\n  --radius-sm:  10px;\n  --radius-md:  14px;\n  --radius-lg:  20px;\n  --radius-xl:  28px;\n  --radius-2xl: 36px;\n  --radius-pill: 999px;\n\n  /* ---------------------------------------------------------\n     SHADOWS — soft, warm-tinted (no cold grey shadows)\n     --------------------------------------------------------- */\n  --shadow-xs: 0 1px 2px rgba(76, 36, 3, 0.08);\n  --shadow-sm: 0 2px 6px rgba(76, 36, 3, 0.08), 0 1px 2px rgba(76, 36, 3, 0.06);\n  --shadow-md: 0 6px 18px rgba(76, 36, 3, 0.10), 0 2px 6px rgba(76, 36, 3, 0.06);\n  --shadow-lg: 0 16px 40px rgba(76, 36, 3, 0.14), 0 4px 12px rgba(76, 36, 3, 0.08);\n  --shadow-xl: 0 28px 70px rgba(76, 36, 3, 0.18), 0 8px 20px rgba(76, 36, 3, 0.10);\n  --shadow-brand: 0 12px 30px rgba(218, 84, 13, 0.30);\n  --shadow-focus: 0 0 0 4px var(--ring);\n\n  /* ---------------------------------------------------------\n     GRADIENTS — warm, sunrise-energy\n     --------------------------------------------------------- */\n  --grad-sunrise: linear-gradient(120deg, #fcdc04 0%, #ec7637 48%, #da540d 100%); /* @kind color */\n  --grad-warm:    linear-gradient(135deg, #f29a67 0%, #da540d 100%); /* @kind color */\n  --grad-fresh:   linear-gradient(135deg, #94d5f4 0%, #2ba3dd 100%); /* @kind color */\n  --grad-paper:   #ffffff;  /* page background is flat white per brand rule */\n  --ink:          #0a0a0a;  /* near-black for dark backgrounds */\n\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 360ms; /* @kind other */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n}\n\n/* ============================================================\n   SEMANTIC TYPE CLASSES — apply directly or copy the rules\n   ============================================================ */\n.display-1 { font-family: var(--font-display); font-weight: 800; font-size: var(--text-5xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.display-2 { font-family: var(--font-display); font-weight: 800; font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--text-3xl); line-height: var(--leading-snug); letter-spacing: var(--tracking-snug); }\n.h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); line-height: var(--leading-snug); letter-spacing: var(--tracking-snug); }\n.h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: var(--leading-snug); }\n.h4 { font-family: var(--font-sans); font-weight: 700; font-size: var(--text-lg); line-height: var(--leading-snug); }\n.lead { font-family: var(--font-sans); font-weight: 500; font-size: var(--text-md); line-height: var(--leading-relaxed); color: var(--fg-2); }\n.body { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-base); line-height: var(--leading-normal); }\n.body-sm { font-family: var(--font-sans); font-weight: 400; font-size: var(--text-sm); line-height: var(--leading-normal); }\n.caption { font-family: var(--font-sans); font-weight: 500; font-size: var(--text-xs); line-height: var(--leading-normal); color: var(--fg-3); }\n.overline { font-family: var(--font-mono); font-weight: 500; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--orange-700); }\n.code { font-family: var(--font-mono); font-weight: 400; font-size: var(--text-sm); }\n<\u002Fstyle>\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n\n  html { -webkit-text-size-adjust: 100%; }\n\n  body {\n    margin: 0;\n    background: var(--neutral-100);\n    /* faint warm desk texture via two soft blobs */\n    background-image:\n      radial-gradient(60vw 50vh at 8% -5%, rgba(252,220,4,0.10), transparent 60%),\n      radial-gradient(55vw 50vh at 100% 8%, rgba(148,213,244,0.12), transparent 60%);\n    background-attachment: fixed;\n    color: var(--neutral-900);\n    font-family: var(--font-sans);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    padding: 48px 20px 80px;\n  }\n\n  /* ---------------- Page (paper) ---------------- */\n  .page {\n    max-width: 816px;\n    margin: 0 auto;\n    background: #ffffff;\n    border-radius: 6px;\n    box-shadow: 0 2px 12px rgba(76,36,3,0.10), 0 24px 60px rgba(76,36,3,0.10);\n    overflow: hidden;\n  }\n  .accent-bar { height: 10px; background: var(--grad-sunrise); }\n  .page-body { padding: 60px 84px 76px; }\n\n  /* ---------------- Masthead ---------------- */\n  .mast { margin-bottom: 44px; }\n  .mast-top {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 40px;\n  }\n  .brand { display: flex; align-items: center; gap: 12px; }\n  .brand img { width: 44px; height: 44px; display: block; }\n  .brand-name {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 1.25rem;\n    letter-spacing: -0.01em;\n    color: var(--neutral-900);\n  }\n  .brand-name b { color: var(--brand-orange); font-weight: 700; }\n  .mast-meta {\n    font-family: var(--font-mono);\n    font-size: 0.7rem;\n    text-transform: uppercase;\n    letter-spacing: 0.14em;\n    color: var(--fg-3);\n    text-align: right;\n    line-height: 1.7;\n    white-space: nowrap;\n  }\n\n  .overline {\n    font-family: var(--font-mono);\n    font-weight: 500;\n    font-size: 0.72rem;\n    text-transform: uppercase;\n    letter-spacing: 0.18em;\n    color: var(--orange-700);\n    margin: 0 0 18px;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .overline::after {\n    content: \"\";\n    flex: 1;\n    height: 2px;\n    background: linear-gradient(90deg, var(--orange-200), transparent);\n    border-radius: 2px;\n  }\n\n  h1.title {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: clamp(2.4rem, 5.4vw, 3.5rem);\n    line-height: 1.04;\n    letter-spacing: -0.02em;\n    margin: 0 0 22px;\n    color: var(--neutral-900);\n    text-wrap: balance;\n  }\n  h1.title em { font-style: normal; color: var(--brand-orange); }\n\n  .subtitle {\n    font-family: var(--font-sans);\n    font-weight: 600;\n    font-size: 1.3rem;\n    line-height: 1.4;\n    color: var(--neutral-700);\n    margin: 0 0 28px;\n    max-width: 46ch;\n    text-wrap: pretty;\n  }\n\n  .byline {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    padding-top: 22px;\n    border-top: 1px solid var(--border);\n  }\n  .byline .avatar {\n    width: 46px; height: 46px;\n    border-radius: 999px;\n    background: var(--grad-warm);\n    color: #fff;\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 1.1rem;\n    display: grid; place-items: center;\n    flex: none;\n    box-shadow: var(--shadow-brand);\n  }\n  .byline .who { font-size: 0.95rem; line-height: 1.45; }\n  .byline .who strong { color: var(--neutral-900); font-weight: 700; }\n  .byline .who span { color: var(--fg-2); }\n\n  /* ---------------- Body type ---------------- */\n  .letter { font-size: 1.0625rem; line-height: 1.72; color: var(--neutral-800); }\n  .letter p { margin: 0 0 1.15em; text-wrap: pretty; }\n  .salutation { font-size: 1.0625rem; margin-bottom: 1.15em; }\n\n  .lede {\n    font-size: 1.22rem;\n    line-height: 1.6;\n    font-weight: 500;\n    color: var(--neutral-900);\n    margin-bottom: 1.4em;\n  }\n  .lede::first-letter {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 3.6rem;\n    line-height: 0.8;\n    float: left;\n    color: var(--brand-orange);\n    padding: 8px 14px 0 0;\n  }\n\n  h2.section {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 1.85rem;\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n    color: var(--neutral-900);\n    margin: 2.4em 0 0.9em;\n    padding-left: 18px;\n    position: relative;\n    text-wrap: balance;\n  }\n  h2.section::before {\n    content: \"\";\n    position: absolute;\n    left: 0; top: 0.18em; bottom: 0.18em;\n    width: 6px;\n    border-radius: 999px;\n    background: var(--grad-sunrise);\n  }\n\n  strong { font-weight: 700; color: var(--neutral-900); }\n  .letter a { color: var(--orange-700); text-decoration: underline; text-underline-offset: 2px; }\n\n  /* ---------------- Stat strip ---------------- */\n  .stats {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 14px;\n    margin: 1.6em 0 1.8em;\n  }\n  .stat {\n    background: var(--neutral-50);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-lg);\n    padding: 22px 20px;\n    break-inside: avoid;\n  }\n  .stat .num {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 2.35rem;\n    line-height: 1;\n    color: var(--brand-orange);\n    letter-spacing: -0.02em;\n  }\n  .stat .num.alt { color: var(--orange-700); }\n  .stat .lbl {\n    font-size: 0.84rem;\n    line-height: 1.4;\n    color: var(--fg-2);\n    margin-top: 10px;\n  }\n\n  /* ---------------- Pull quote ---------------- */\n  .pull {\n    margin: 1.8em 0;\n    padding: 32px 36px;\n    background: var(--neutral-900);\n    border-radius: var(--radius-xl);\n    color: #fff;\n    position: relative;\n    overflow: hidden;\n  }\n  .pull::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background: radial-gradient(120% 140% at 100% 0%, rgba(218,84,13,0.45), transparent 55%);\n    pointer-events: none;\n  }\n  .pull p {\n    position: relative;\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: 1.5rem;\n    line-height: 1.32;\n    margin: 0;\n    letter-spacing: -0.01em;\n    text-wrap: balance;\n  }\n  .pull .q-mark {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 0.78rem;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--brand-yellow);\n    display: block;\n    margin-bottom: 14px;\n    position: relative;\n  }\n\n  /* ---------------- Pillars ---------------- */\n  .pillars { margin: 1.6em 0 1.8em; display: grid; gap: 14px; }\n  .pillar {\n    display: grid;\n    grid-template-columns: 64px 1fr;\n    gap: 22px;\n    align-items: start;\n    background: var(--neutral-50);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-lg);\n    padding: 24px 26px;\n    break-inside: avoid;\n  }\n  .pillar .idx {\n    font-family: var(--font-mono);\n    font-weight: 700;\n    font-size: 1.5rem;\n    color: var(--brand-orange);\n    line-height: 1;\n    padding-top: 4px;\n  }\n  .pillar h3 {\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: 1.22rem;\n    margin: 0 0 8px;\n    color: var(--neutral-900);\n  }\n  .pillar p { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--neutral-700); }\n\n  /* ---------------- Callout (fresh air) ---------------- */\n  .callout {\n    margin: 1.6em 0;\n    padding: 24px 28px;\n    background: var(--blue-50);\n    border: 1px solid var(--blue-200);\n    border-radius: var(--radius-lg);\n    display: flex;\n    gap: 18px;\n    align-items: flex-start;\n    break-inside: avoid;\n  }\n  .callout .ico {\n    font-size: 1.6rem;\n    color: var(--blue-600);\n    line-height: 1;\n    flex: none;\n    margin-top: 2px;\n  }\n  .callout p { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--blue-900); }\n  .callout strong { color: var(--blue-800); }\n\n  /* ---------------- Outcome / address lists ---------------- */\n  .feature-list { list-style: none; margin: 1.4em 0 1.6em; padding: 0; display: grid; gap: 2px; }\n  .feature-list li {\n    position: relative;\n    padding: 14px 0 14px 38px;\n    border-bottom: 1px solid var(--border);\n    font-size: 1.0625rem;\n    line-height: 1.6;\n    color: var(--neutral-800);\n    break-inside: avoid;\n  }\n  .feature-list li:last-child { border-bottom: 0; }\n  .feature-list li::before {\n    content: \"\";\n    position: absolute;\n    left: 4px; top: 1.42em;\n    width: 16px; height: 3px;\n    border-radius: 2px;\n    background: var(--brand-orange);\n  }\n  .feature-list li strong { color: var(--neutral-900); }\n\n  .address-list { list-style: none; margin: 1.2em 0 1.6em; padding: 0; display: grid; gap: 14px; }\n  .address-list li {\n    position: relative;\n    padding-left: 32px;\n    font-size: 1.0625rem;\n    line-height: 1.6;\n    color: var(--neutral-800);\n    break-inside: avoid;\n  }\n  .address-list li::before {\n    content: \"\\2192\";\n    position: absolute; left: 0; top: 0;\n    color: var(--brand-orange);\n    font-weight: 700;\n  }\n  .address-list li strong { color: var(--neutral-900); }\n\n  /* ---------------- Signature ---------------- */\n  .closer { margin-top: 2.4em; }\n  .signature {\n    margin-top: 2.4em;\n    padding-top: 28px;\n    border-top: 1px solid var(--border);\n    display: flex;\n    align-items: flex-start;\n    gap: 18px;\n    flex-wrap: wrap;\n  }\n  .signature .sig-name {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 1.4rem;\n    color: var(--neutral-900);\n  }\n  .signature .sig-role {\n    font-family: var(--font-mono);\n    font-size: 0.78rem;\n    text-transform: uppercase;\n    letter-spacing: 0.12em;\n    color: var(--fg-2);\n    margin-top: 6px;\n    white-space: nowrap;\n  }\n  .signature .sig-mail { font-size: 0.95rem; margin-top: 6px; }\n  .signature .sig-mail a { color: var(--orange-700); }\n  .signature img { width: 52px; height: 52px; margin-top: 2px; }\n\n  /* ---------------- Closing quote ---------------- */\n  .closing-quote {\n    margin-top: 40px;\n    padding: 34px 36px;\n    border-radius: var(--radius-xl);\n    background: var(--grad-sunrise);\n    color: var(--neutral-900);\n    break-inside: avoid;\n  }\n  .closing-quote p {\n    margin: 0;\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: 1.35rem;\n    line-height: 1.4;\n    letter-spacing: -0.01em;\n    text-wrap: balance;\n  }\n  .closing-quote .accent { color: #fff; }\n\n  /* ---------------- Print ---------------- */\n  @media print {\n    @page { margin: 0.7in; }\n    html, body {\n      background: #fff;\n      padding: 0;\n      background-image: none;\n    }\n    .page {\n      max-width: none;\n      box-shadow: none;\n      border-radius: 0;\n      margin: 0;\n    }\n    .accent-bar { display: none; }\n    .page-body { padding: 0; }\n    .pull, .closing-quote, .stat, .pillar, .callout { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    h2.section, .pillar, .stat, .callout, .feature-list li, .address-list li, .signature, .closing-quote { break-inside: avoid; }\n  }\n\n  @media (max-width: 640px) {\n    body { padding: 16px 0 40px; }\n    .page-body { padding: 40px 26px 48px; }\n    .stats { grid-template-columns: 1fr; }\n    .pillar { grid-template-columns: 1fr; gap: 10px; }\n    .mast-top { flex-direction: column; align-items: flex-start; gap: 14px; }\n    .mast-meta { text-align: left; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <article class=\"page\">\n    <div class=\"accent-bar\"><\u002Fdiv>\n    <div class=\"page-body\">\n\n      <!-- MASTHEAD -->\n      <header class=\"mast\">\n        <div class=\"mast-top\">\n          <div class=\"brand\">\n            <img src=\"2853c50f-cd3b-4c0d-879c-b7c7f897b27e\" alt=\"OPTIMINNO\">\n            <span class=\"brand-name\">optim<b>inno<\u002Fb><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"mast-meta\">\n            Offener Brief<br>\n            Human · AI · Fit\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p class=\"overline\">Offener Brief<\u002Fp>\n        <h1 class=\"title\">Warum jedes Dorf jetzt einen <em>Abundance&nbsp;Hub<\u002Fem> braucht<\u002Fh1>\n        <p class=\"subtitle\">An Bürgermeister, Unternehmer und alle, die nicht mehr warten wollen.<\u002Fp>\n\n        <div class=\"byline\">\n          <div class=\"avatar\">BJ<\u002Fdiv>\n          <div class=\"who\">\n            <strong>Boris Janek<\u002Fstrong><br>\n            <span>KI-Consultant &amp; Human-AI-Fit Coach, OPTIMINNO<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <!-- LETTER -->\n      <div class=\"letter\">\n        <p class=\"salutation\">Sehr geehrte Damen und Herren,<\u002Fp>\n\n        <p class=\"lede\">ich schreibe Ihnen diesen Brief nicht, weil ich Ihre Region kenne. Ich schreibe ihn, weil ich die Muster kenne. Und weil ich glaube, dass die Menschen vor Ort — nicht die Politik in Berlin — die Entscheidung treffen werden, ob Ihr Dorf, Ihre Stadt, Ihre Region in zehn Jahren noch lebensfähig ist.<\u002Fp>\n\n        <h2 class=\"section\">Die Lage, die wir nicht schönreden sollten<\u002Fh2>\n        <p>Deutschlands Industrieproduktion ist seit 2018 um rund 15 Prozent gefallen. In der Chemie- und Autoindustrie liegt der Rückgang bei über 22 Prozent. Das trifft den ländlichen Raum zuerst und am härtesten — nicht weil die Dörfer schwächer wären, sondern weil sie von zentralisierten Strukturen abhängig gemacht wurden, die jetzt wegbrechen.<\u002Fp>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <div class=\"num\">−15&nbsp;%<\u002Fdiv>\n            <div class=\"lbl\">Industrieproduktion in Deutschland seit 2018<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stat\">\n            <div class=\"num\">−22&nbsp;%<\u002Fdiv>\n            <div class=\"lbl\">Rückgang in der Chemie- und Autoindustrie<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stat\">\n            <div class=\"num alt\">11.000<\u002Fdiv>\n            <div class=\"lbl\">Hausärzte fehlen bundesweit<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p>11.000 Hausärzte fehlen bundesweit. In ländlichen Regionen Bayerns, Sachsens und Niedersachsens bleiben Praxen schlicht unbesetzt, weil es keine Nachfolger gibt. Die Kassenärztliche Vereinigung Niedersachsen prognostiziert: Bis 2035 sinkt die Zahl der Hausärzte im Land von 5.044 auf etwa 3.750. Gleichzeitig stehen in Großstädten mancherorts über sieben Ärzte pro 1.000 Einwohner zur Verfügung.<\u002Fp>\n\n        <p>Diese Entwicklung ist das Ergebnis eines Systems, das seit Jahrzehnten Infrastruktur, Kapital und Talente in die Zentren zieht — und den Rest mit Förderanträgen vertröstet.<\u002Fp>\n\n        <p>Ich sage das nicht, um Schuld zuzuweisen. Ich sage es, weil die Diagnose die Voraussetzung für die richtige Lösung ist.<\u002Fp>\n\n        <h2 class=\"section\">Warum Förderanträge diesmal nicht reichen<\u002Fh2>\n        <p>Bitte verstehen Sie mich nicht falsch: Ich bin nicht gegen staatliche Unterstützung. Wer verfügbare Mittel nicht nutzt, handelt unklug.<\u002Fp>\n        <p>Aber ich bin in mehr als zwei Jahrzehnten Erfahrung in der digitalen Transformation zu einer klaren Überzeugung gelangt: <strong>Veränderung, die auf Genehmigung wartet, bleibt bis zuletzt Veränderung auf dem Papier.<\u002Fstrong><\u002Fp>\n        <p>Förderprogramme haben Antragsfristen. Bewilligungsverfahren. Ausschreibungspflichten. Widerspruchsmöglichkeiten. Bis ein kommunales Projekt durch alle Instanzen ist, haben technologisch mutige Unternehmer in anderen Regionen — und anderen Ländern — den Markt besetzt.<\u002Fp>\n        <p>Die Technologie, über die ich gleich spreche, entwickelt sich nicht im Takt von Haushaltsjahren. Sie verdoppelt ihre Leistung ungefähr alle 12 bis 18 Monate. Wer 2027 anfängt zu handeln, startet nicht dort, wo andere 2025 aufgehört haben. Er startet weit dahinter.<\u002Fp>\n\n        <h2 class=\"section\">Was ich mit „Abundance Hub\" meine<\u002Fh2>\n        <p>Ich verwende diesen Begriff bewusst, weil er etwas beschreibt, das es in Deutschland noch kaum gibt — aber dringend gebraucht wird.<\u002Fp>\n        <p>Bevor ich erkläre, was ein Abundance Hub konkret ist, muss ich ehrlich sein über das, worauf er vorbereitet. Nicht auf die nächste Digitalisierungs-Welle. Nicht auf hybrides Arbeiten oder bessere Software. Sondern auf etwas, für das wir noch keine guten Worte haben.<\u002Fp>\n        <p>Wir stehen vor der realistischen Möglichkeit, dass menschliche Arbeit — so wie wir sie seit der Industrialisierung kennen — in großen Teilen wegfallen wird. Nicht in ferner Zukunft. In einem Zeithorizont, den wir mit unseren heutigen Kategorien noch nicht erfassen können. Maschinen, die denken. Roboter, die produzieren. KI-Systeme, die diagnostizieren, planen, entwerfen und koordinieren.<\u002Fp>\n        <p>Wenn Wertschöpfung zunehmend ohne menschliche Arbeitskraft auskommt, dann bricht das Fundament weg, auf dem unsere gesamte soziale und wirtschaftliche Ordnung aufgebaut ist: die Gleichung zwischen Arbeiten und Teilhaben.<\u002Fp>\n        <p>Aber — das wird Sie vielleicht überraschen — es ist kein Grund zur Panik, wenn wir uns konsequent auf diese Zeit vorbereiten.<\u002Fp>\n        <p>Denn wenn Maschinen die Arbeit übernehmen, entsteht etwas, das wir Abundance nennen — Überfluss. Güter und Dienstleistungen, die nicht mehr durch die menschliche Arbeitszeit begrenzt sind, sondern durch Technologie in Hülle und Fülle produziert werden können. Die entscheidende Frage ist dann nicht mehr: Wer arbeitet? Sondern: Wer hat Zugang? Wer besitzt die Infrastruktur? Wer ist Teil des Systems — und wer nicht?<\u002Fp>\n\n        <div class=\"pull\">\n          <span class=\"q-mark\">Vom Ende her gedacht<\u002Fspan>\n          <p>Wie muss eine Region heute aufgestellt sein, um in einer Welt ohne klassische Lohnarbeit noch Wohlstand, Würde und Selbstbestimmung für ihre Menschen zu sichern?<\u002Fp>\n        <\u002Fdiv>\n\n        <p>Die Antwort liegt nicht in staatlichen Transfersystemen, die von außen finanziert werden. Sie liegt in lokaler Infrastruktur, lokaler Energie, lokaler Produktionskapazität und lokalem Wissen — verankert in der Region, im Besitz der Menschen, die dort leben.<\u002Fp>\n        <p>Ein <strong>Abundance Hub<\u002Fstrong> ist kein Technologiepark. Kein Coworking-Space. Kein Förderprojekt. Er ist ein privat oder genossenschaftlich organisierter, physischer Knotenpunkt, der vier Dinge in einer Region verankert, die bisher — wenn überhaupt — nur in der Stadt zu finden waren:<\u002Fp>\n\n        <div class=\"pillars\">\n          <div class=\"pillar\">\n            <div class=\"idx\">01<\u002Fdiv>\n            <div>\n              <h3>Digitale &amp; KI-Kompetenz<\u002Fh3>\n              <p>Nicht als Seminar, sondern als produktive Infrastruktur. Landwirte, Handwerker und kleine Unternehmer lernen, KI-Werkzeuge konkret in ihren Alltag zu integrieren — und gewinnen damit Stunden pro Woche zurück, die heute in administrative Tätigkeiten fließen.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <div class=\"idx\">02<\u002Fdiv>\n            <div>\n              <h3>Lokale Fertigungskapazität<\u002Fh3>\n              <p>3D-Druck, CNC-Bearbeitung, additive Fertigung. Ersatzteile mit heute sechs Tagen Lieferzeit werden morgen vor Ort produziert. Kleinserien, individuelle Anfertigungen, lokale Wertschöpfung — ohne Abhängigkeit von globalen Lieferketten.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <div class=\"idx\">03<\u002Fdiv>\n            <div>\n              <h3>Energieautarkie<\u002Fh3>\n              <p>Solar, Speicher, intelligente Steuerung. Nicht als ökologisches Statement, sondern als unternehmerische Entscheidung: Wer seine eigene Energie produziert, ist unabhängig von Preisspiralen und hat einen dauerhaften Kostenvorteil.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <div class=\"idx\">04<\u002Fdiv>\n            <div>\n              <h3>Generationenübergreifendes Lernen<\u002Fh3>\n              <p>Kein Klassenzimmer — aber vielleicht der ehrlichste Lernort, den eine Region anbieten kann. Schüler arbeiten mit echten Technologien an echten Problemen. Eltern verstehen, welche Kompetenzen wirklich zählen. Und ältere Menschen bringen ein, was kein KI-System replizieren kann: die Erfahrung, bereits mehrere Systembrüche überlebt — und gestaltet — zu haben. Was wirklich zählt, ändert sich langsamer als die Technologie.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"callout\">\n          <span class=\"ico\"><i class=\"ph-fill ph-robot\"><\u002Fi><\u002Fspan>\n          <p>Dazu kommt mittelfristig der Einstieg in robotergestützte Arbeit. <strong>Humanoide Roboter, die vor zwei Jahren noch Laborprototypen waren, sind heute serienreif und für unter 20.000 Dollar erhältlich.<\u002Fstrong> Bis 2028 werden sie in Bereichen mit akutem Fachkräftemangel eingesetzt — Pflege, Handwerk, Logistik, Landwirtschaft. Wer sich jetzt positioniert, wird nicht überrascht.<\u002Fp>\n        <\u002Fdiv>\n\n        <h2 class=\"section\">Warum das genossenschaftliche Modell hier besonders interessant ist<\u002Fh2>\n        <p>Viele Regionen in Deutschland haben eine starke genossenschaftliche Tradition — in der Landwirtschaft, im Bankenwesen, in der Energieversorgung. Diese Tradition ist kein Relikt. Sie ist eine Blaupause.<\u002Fp>\n        <p>Ein Abundance Hub als Genossenschaft oder hybrides Modell (Genossenschaft + GmbH) verbindet die Geschwindigkeit privatwirtschaftlichen Handelns mit der Verwurzelung in der Region. Jedes Mitglied hat ein direktes wirtschaftliches Interesse am Erfolg. Entscheidungen werden lokal getroffen. Gewinne bleiben lokal.<\u002Fp>\n        <p>Das ist das Gegenteil von zentralisierter Planung — und deshalb so viel wirkungsvoller.<\u002Fp>\n\n        <h2 class=\"section\">Was das für Ihre Region konkret bedeuten kann<\u002Fh2>\n        <p>Ich möchte keine abstrakten Versprechen machen. Deshalb formuliere ich konkret, was ein Abundance Hub in einer Gemeinde mit 5.000 bis 50.000 Einwohnern in den ersten <strong>24 Monaten<\u002Fstrong> leisten kann:<\u002Fp>\n\n        <ul class=\"feature-list\">\n          <li>Einen <strong>generationenübergreifenden Lernort<\u002Fstrong> etablieren, an dem Schüler mit echter Technologie arbeiten, Eltern verstehen, worauf sie ihre Kinder vorbereiten sollten, und ältere Menschen ihr Erfahrungswissen in eine neue Zeit übersetzen — nicht als Randgruppe, sondern als tragende Säule.<\u002Fli>\n          <li><strong>Lokale KI-Kompetenz<\u002Fstrong> bei Unternehmen und Selbstständigen aufbauen, die ihre Prozesse teilautomatisieren und dadurch wettbewerbsfähiger werden.<\u002Fli>\n          <li>Eine <strong>Micro-Factory<\u002Fstrong> etablieren, die regionale Handwerksbetriebe bei Ersatzteilproduktion und Kleinserienfertigung unterstützt und Lieferketten verkürzt.<\u002Fli>\n          <li>Eine <strong>regionale Energiegemeinschaft<\u002Fstrong> strukturieren, die Produktionskosten senkt und Einnahmen innerhalb der Region hält.<\u002Fli>\n          <li>Eine Infrastruktur für <strong>telemedizinische Grundversorgung<\u002Fstrong> schaffen, die den Ärztemangel kompensiert.<\u002Fli>\n          <li>Neue Formen der <strong>regionalen Selbstorganisation<\u002Fstrong> entwickeln, in denen Bürger direkt an Entscheidungen beteiligt sind, die ihren Alltag betreffen — nicht als Ersatz für demokratische Legitimation, sondern als deren konsequente Weiterentwicklung. Regionen, die das früh erkennen, werden nicht nur resilienter, sondern attraktiver für genau die Menschen, die man halten oder gewinnen möchte: Unternehmer, Familien, Talente.<\u002Fli>\n        <\u002Ful>\n\n        <p>Das ist kein Zehn-Jahres-Plan. Das ist, was in 24 Monaten machbar ist — mit dem richtigen Rahmen, den richtigen Partnern und dem Willen, anzufangen.<\u002Fp>\n\n        <h2 class=\"section\">An wen ich diesen Brief richte<\u002Fh2>\n        <ul class=\"address-list\">\n          <li>An <strong>Bürgermeister und Gemeinderäte<\u002Fstrong>, die verstehen, dass sie nicht auf Förderanträge warten können, wenn ihre Region in fünf Jahren noch lebendig sein soll.<\u002Fli>\n          <li>An <strong>Unternehmer<\u002Fstrong> in Handwerk, Landwirtschaft, Einzelhandel und Dienstleistung, die spüren, dass sich etwas fundamental verändert — und lieber gestalten möchten als verwaltet werden.<\u002Fli>\n          <li>An <strong>Genossenschaften, Verbände und Kammern<\u002Fstrong>, die eine neue Rolle suchen und verstehen, dass ihre Mitglieder Orientierung brauchen, keine weiteren Informationsbroschüren.<\u002Fli>\n          <li>An <strong>alle, die ihre Heimat lieben<\u002Fstrong> und bereit sind zu handeln — bevor sie müssen.<\u002Fli>\n        <\u002Ful>\n\n        <h2 class=\"section\">Mein Angebot<\u002Fh2>\n        <p>Ich stelle meine Perspektive und mein Abundance-Hub-Konzept in Ihrer Region vor — in einem Vortrag, einem Workshop oder einem strategischen Gespräch mit Ihrem Führungskreis. Ohne Verbindlichkeit. Mit dem Ziel, gemeinsam zu beurteilen, ob und wie ein solcher Hub in Ihrer spezifischen Situation Sinn macht.<\u002Fp>\n        <p>Ich habe mehr als 26 Jahre Erfahrung in der digitalen Transformation, davon die letzten Jahre intensiv an der Schnittstelle von KI, Automatisierung und Organisationsentwicklung. Ich spreche nicht über Technologie im Labor — ich arbeite täglich damit.<\u002Fp>\n\n        <div class=\"closer\">\n          <p>Wenn Sie neugierig sind: <strong>Laden Sie mich ein.<\u002Fstrong> Eine E-Mail genügt.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"signature\">\n          <img src=\"2853c50f-cd3b-4c0d-879c-b7c7f897b27e\" alt=\"OPTIMINNO\">\n          <div>\n            <div class=\"sig-name\">Boris Janek<\u002Fdiv>\n            <div class=\"sig-role\">OPTIMINNO — Human · AI · Fit<\u002Fdiv>\n            <div class=\"sig-mail\"><a href=\"mailto:b.janek@optiminno.de\">b.janek@optiminno.de<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"closing-quote\">\n          <p>„Deutschland hat sich immer nur dann neu erfunden, wenn es gar nicht mehr anders ging.\" Dieser Moment ist jetzt. <span class=\"accent\">Nur diesmal können wir nicht warten, bis politische Entscheider das erkennen.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <script src=\"df52fe74-4b07-4aa7-b286-bab517a46d48\"><\u002Fscript>\n\n  \n\n\n<\u002Fbody><\u002Fhtml>"
